name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package (not editable, so the data tables must ship with it)
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Run the tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
