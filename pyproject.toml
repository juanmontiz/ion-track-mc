[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ion_track_mc"
version = "0.1.0"
description = "Educational event-by-event Monte Carlo code for proton track structure in liquid water."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Juan Manuel Monti" },
    { name = "Michele Arcangelo Quinto" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/juanmontiz/ion-track-mc"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["ion_track_mc*"]

# The cross-section tables must ship with the package (pip install from git/zip).
[tool.setuptools.package-data]
ion_track_mc = ["data/cross_sections/*.dat", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
